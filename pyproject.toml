[project]
name = "kiwi-berry"
version = "0.1.0"
description = "A kiwi.cum API wrapper"
authors = [
  {name = "Martin Mokry"}
]
readme = "README.md"
license = "NON-AI-BSD2"
packages = [{include = "kiwi_berry"}]
keywords = ["kiwi.com", "flights", "search", "API"]

requires-python = ">=3.11"

dependencies = [
  "pydantic",
  "aiohttp",
]

[build-system]
requires = ["poetry-core"]
build-backend = "poetry.core.masonry.api"

[tool.black]
line-length = 130

[tool.pylint."MESSAGES CONTROL"]
max-line-length = 130

[tool.isort]
atomic = true
profile = "black"
line_length = 130
skip_gitignore = true

[dependency-groups]
orjson = [
  "orjson",
]
dev = [
    "pytest",
    "pytest-cov",
    "flake8",
    "ruff",
    "mypy",
    "pre-commit",

]
